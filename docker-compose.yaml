version: "3.9"

services:
  web:
    build: .
    command: ["uv", "run", "uvicorn", "app.main.app", "--host", "0.0.0.0", "--port", "10000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: farmconnect
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
