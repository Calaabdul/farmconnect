version: "3.9"
services:
  web:
    build: .
    command: python main.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: farmconnect
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Redis omitted: background processing uses FastAPI in-process handlers

volumes:
  db_data:
